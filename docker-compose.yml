version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: quantum_redis
    ports:
      - "6379:6379"
    restart: always

  quantum_engine:
    build: .
    container_name: quantum_engine
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - REDIS_HOST=redis
    depends_on:
      - redis
    restart: always
